<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donatshop_uz Web App</title>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

    <style>
        /* GLASSMORPHISM & DARK GLOW THEME */
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-border-light: rgba(255, 255, 255, 0.3);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-glow: #0088ff;
            --cyan-glow: #00f0ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px; 
            overflow-x: hidden;
            position: relative;
        }

        /* ORQA FONDAGI NURLAR */
        .glow-orb-1 {
            position: fixed; top: -10%; left: -10%;
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(0, 100, 255, 0.4) 0%, transparent 70%);
            filter: blur(80px); z-index: -1;
        }
        .glow-orb-2 {
            position: fixed; bottom: 10%; right: -10%;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.25) 0%, transparent 70%);
            filter: blur(100px); z-index: -1;
        }

        .header {
            text-align: center; padding: 20px;
            font-size: 1.4rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 3px;
            color: #fff; position: sticky; top: 0; z-index: 50;
            background: rgba(5, 5, 5, 0.6); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
        }

        .page {
            display: none; padding: 15px;
            animation: fadeIn 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .page.active-page { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* TABLAR */
        .tabs {
            display: flex; background: rgba(255, 255, 255, 0.05);
            border-radius: 30px; margin-bottom: 25px; padding: 5px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px); width: 90%; margin: 0 auto 25px auto;
        }
        .tab-btn {
            flex: 1; padding: 12px; text-align: center;
            background: transparent; color: var(--text-muted);
            border: none; cursor: pointer; font-weight: bold;
            border-radius: 25px; transition: all 0.3s ease; font-size: 0.95rem;
        }
        .tab-btn.active-tab {
            background: #fff; color: #000;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }
        
        /* MAHSULOT KARTALARI */
        .products-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
        }
        .card {
            background: var(--glass-bg); backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px); border-radius: 20px;
            padding: 25px 15px; display: flex; flex-direction: column;
            align-items: center; text-align: center;
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-border-light);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            cursor: pointer; transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
        }
        .card:hover, .card:active {
            transform: translateY(-5px); border-color: rgba(0, 240, 255, 0.5);
            box-shadow: 0 20px 40px rgba(0, 240, 255, 0.15);
        }

        .card svg { margin-bottom: 15px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5)); }
        
        .product-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; color: #fff; letter-spacing: 0.5px; }
        .product-desc { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 20px; min-height: 18px; line-height: 1.3; }
        
        .product-price { 
            font-size: 0.95rem; font-weight: bold; color: #000; 
            background: #fff; padding: 8px 18px; border-radius: 30px; 
            width: 100%; transition: 0.2s; box-shadow: 0 4px 10px rgba(255,255,255,0.1);
        }
        .card:active .product-price { transform: scale(0.95); }

        /* MODAL */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
            z-index: 200; justify-content: center; align-items: center;
        }
        .modal-content {
            background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(30px);
            width: 90%; max-width: 360px; padding: 30px 20px;
            border-radius: 24px; text-align: center; position: relative;
            border: 1px solid var(--glass-border-light);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 240, 255, 0.1);
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideUp {
            from { transform: translateY(50px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        .close-btn {
            position: absolute; top: 15px; right: 20px; font-size: 2rem;
            color: #888; cursor: pointer; transition: 0.2s; line-height: 1;
        }
        .close-btn:active { color: #fff; transform: scale(0.9); }
        
        .modal-title { font-size: 1.5rem; color: #fff; margin-bottom: 25px; font-weight: 800; }
        
        .id-input {
            width: 100%; padding: 16px; background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 15px;
            color: #fff; margin-bottom: 25px; text-align: center;
            font-size: 1rem; outline: none; transition: 0.3s;
        }
        .id-input:focus { border-color: var(--cyan-glow); background: rgba(0, 240, 255, 0.05); }
        .id-input::placeholder { color: #666; }
        
        .qty-controls { display: flex; justify-content: center; align-items: center; gap: 25px; margin-bottom: 25px; }
        .qty-btn {
            background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2);
            width: 45px; height: 45px; border-radius: 50%; font-size: 1.5rem; cursor: pointer;
            display: flex; justify-content: center; align-items: center; transition: 0.2s;
        }
        .qty-btn:active { background: #fff; color: #000; transform: scale(0.9); }
        .qty-display { font-size: 1.8rem; font-weight: bold; width: 40px; color: #fff; }
        
        .total-price { font-size: 1.6rem; font-weight: 900; margin-bottom: 15px; color: var(--cyan-glow); }
        
        .error-message {
            color: #ff3366; font-size: 0.9rem; font-weight: bold;
            margin-bottom: 15px; display: none;
        }
        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .btn-confirm {
            background: #fff; color: #000; border: none; width: 100%; padding: 16px 0;
            border-radius: 15px; font-weight: bold; font-size: 1.1rem;
            cursor: pointer; transition: 0.2s;
        }
        .btn-confirm:active { transform: scale(0.97); background: #eee; }

        /* SAVATGA UCHISH ANIMATSIYASI */
        .flying-item {
            position: fixed;
            width: 25px; height: 25px;
            background: var(--cyan-glow);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--cyan-glow), 0 0 40px #fff;
            z-index: 1000; pointer-events: none;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .cart-bump { animation: bump 0.4s ease; }
        @keyframes bump {
            0% { transform: scale(1) translateY(-35px); }
            50% { transform: scale(1.4) translateY(-35px); color: var(--cyan-glow); }
            100% { transform: scale(1) translateY(-35px); }
        }

        .profile-card { 
            background: var(--glass-bg); backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border-light); 
            border-radius: 20px; padding: 40px 20px; text-align: center; 
        }
        .balance-amount { font-size: 2.5rem; font-weight: 900; margin: 15px 0; color: #fff; }

        /* TO'G'RILANGAN PASTKI BAR (NAV BAR) */
        .navigation {
            width: 100%; height: 75px; 
            background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(20px);
            position: fixed; bottom: 0; left: 0;
            border-top: 1px solid var(--glass-border);
            display: flex; justify-content: center; align-items: center;
            border-top-left-radius: 25px; border-top-right-radius: 25px; z-index: 100;
        }
        .navigation ul { 
            display: flex; width: 350px; position: relative; /* QIyshiqlikni shu to'g'rilaydi */
        }
        .navigation ul li { 
            position: relative; list-style: none; width: 70px; height: 75px; z-index: 1; 
        }
        .navigation ul li a { 
            position: relative; display: flex; justify-content: center; align-items: center; 
            flex-direction: column; width: 100%; text-align: center; 
        }
        .navigation ul li a .icon { 
            position: relative; display: block; line-height: 80px; font-size: 1.6em; 
            text-align: center; transition: 0.5s; color: #888; 
        }
        .navigation ul li.active a .icon { 
            transform: translateY(-35px); color: #000; 
        }
        
        .indicator {
            position: absolute; top: -35px; width: 60px; height: 60px; background: #fff;
            border-radius: 50%; border: 6px solid var(--bg-color); transition: 0.5s;
            box-shadow: 0 -5px 15px rgba(255,255,255,0.2);
            left: 5px; /* (70 - 60) / 2 = 5 markazda turishi uchun */
        }
        .indicator::before { content: ''; position: absolute; top: 40%; left: -22px; width: 20px; height: 20px; background: transparent; border-top-right-radius: 20px; box-shadow: 1px -10px 0 0 var(--bg-color); }
        .indicator::after { content: ''; position: absolute; top: 40%; right: -22px; width: 20px; height: 20px; background: transparent; border-top-left-radius: 20px; box-shadow: -1px -10px 0 0 var(--bg-color); }

        /* Indicator harakatlanishi */
        .navigation ul li:nth-child(1).active ~ .indicator { transform: translateX(calc(70px * 0)); }
        .navigation ul li:nth-child(2).active ~ .indicator { transform: translateX(calc(70px * 1)); }
        .navigation ul li:nth-child(3).active ~ .indicator { transform: translateX(calc(70px * 2)); }
        .navigation ul li:nth-child(4).active ~ .indicator { transform: translateX(calc(70px * 3)); }
        .navigation ul li:nth-child(5).active ~ .indicator { transform: translateX(calc(70px * 4)); }
    </style>
</head>
<body>

    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>

    <div class="header">Donatshop_uz</div>

    <div id="page-asosiy" class="page active-page">
        <div class="tabs">
            <button class="tab-btn active-tab" onclick="switchCategory('pubg')">PUBG UC</button>
            <button class="tab-btn" onclick="switchCategory('premium')">TG Premium</button>
        </div>
        
        <div class="products-grid" id="grid-pubg"></div>
        <div class="products-grid" id="grid-premium" style="display: none;"></div>
    </div>

    <div id="page-profil" class="page">
        <div class="profile-card">
            <div style="color: #888; margin-bottom: 10px;">ID: 52170909145</div>
            <div class="balance-amount" id="user-balance-display">15 000 so'm</div>
            <div style="color: #aaa; font-size: 0.9rem;">Mening hisobim</div>
        </div>
    </div>
    
    <div id="page-sozlamalar" class="page"><div class="profile-card" style="color:#fff;">Sozlamalar</div></div>
    <div id="page-savat" class="page"><div class="profile-card" style="color:#fff;">Savat hozircha bo'sh</div></div>
    <div id="page-hisob" class="page"><div class="profile-card" style="color:#fff;">To'lov usullari</div></div>

    <!-- PASTKI BAR -->
    <div class="navigation">
        <ul>
            <li class="list active" data-target="page-asosiy"><a href="#"><span class="icon"><ion-icon name="home-outline"></ion-icon></span></a></li>
            <li class="list" data-target="page-profil"><a href="#"><span class="icon"><ion-icon name="person-outline"></ion-icon></span></a></li>
            <li class="list" data-target="page-sozlamalar"><a href="#"><span class="icon"><ion-icon name="settings-outline"></ion-icon></span></a></li>
            <li class="list" id="cart-nav" data-target="page-savat"><a href="#"><span class="icon" id="cart-icon"><ion-icon name="cart-outline"></ion-icon></span></a></li>
            <li class="list" data-target="page-hisob"><a href="#"><span class="icon"><ion-icon name="wallet-outline"></ion-icon></span></a></li>
            <div class="indicator"></div>
        </ul>
    </div>

    <!-- SOTIB OLISH MODALI -->
    <div class="modal-overlay" id="buyModal">
        <div class="modal-content" id="modalBox">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 class="modal-title" id="modalTitle">60 UC</h3>
            
            <input type="text" id="playerIdInput" class="id-input" placeholder="Ma'lumot kiriting">
            
            <div class="qty-controls">
                <button class="qty-btn" onclick="changeQty(-1)">-</button>
                <div class="qty-display" id="qtyValue">1</div>
                <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
            
            <div class="total-price" id="modalTotalPrice">0 so'm</div>
            
            <div class="error-message" id="errorMsg">⚠️ Yetarli mablag' mavjud emas!</div>
            
            <button class="btn-confirm" id="addCartBtn" onclick="processPurchase()">Savatga qo'shish</button>
        </div>
    </div>

    <script>
        let userBalance = 15000; 

        // YANGILANGAN TILLA RANG PUBG UC IKONKASI (Siz yuborgan dizayn asosida)
        const ucIconSVG = `
        <svg viewBox="0 0 100 100" width="60" height="60">
            <defs>
                <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FBF5B7"/>
                    <stop offset="25%" stop-color="#E6C875"/>
                    <stop offset="50%" stop-color="#FFD700"/>
                    <stop offset="75%" stop-color="#D4AF37"/>
                    <stop offset="100%" stop-color="#996600"/>
                </linearGradient>
                <linearGradient id="dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#2a2a2a"/>
                    <stop offset="100%" stop-color="#0a0a0a"/>
                </linearGradient>
            </defs>
            <!-- Oltin Ramka -->
            <polygon points="10,25 90,25 100,35 100,65 90,75 10,75 0,65 0,35" fill="url(#gold-grad)"/>
            <!-- Qora Ichki Qism -->
            <polygon points="14,29 86,29 94,37 94,63 86,71 14,71 6,63 6,37" fill="url(#dark-grad)"/>
            <!-- UC Yozuvi -->
            <text x="50" y="61" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="34" fill="url(#gold-grad)" text-anchor="middle" letter-spacing="1">UC</text>
        </svg>`;

        // TG Premium Yulduzi (O'zgarishsiz qoldi)
        const premiumIconSVG = `
        <svg viewBox="0 0 100 100" width="55" height="55">
            <defs>
                <linearGradient id="premium-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#A958FF" />
                    <stop offset="40%" stop-color="#FF599E" />
                    <stop offset="100%" stop-color="#2191FF" />
                </linearGradient>
            </defs>
            <circle cx="50" cy="50" r="50" fill="url(#premium-grad)" />
            <path d="M50 20 l7 17 l18 2 l-14 12 l4 18 l-15 -9 l-15 9 l4 -18 l-14 -12 l18 -2 z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round" />
            <path d="M28 25 l1 4 l4 1 l-4 1 l-1 4 l-1 -4 l-4 -1 l4 -1 z" fill="#fff"/>
            <path d="M78 28 l1 3 l3 1 l-3 1 l-1 3 l-1 -3 l-3 -1 l3 -1 z" fill="#fff"/>
            <path d="M22 65 l1 2 l2 1 l-2 1 l-1 2 l-1 -2 l-2 -1 l2 -1 z" fill="#fff"/>
        </svg>`;

        const ucData = [
            { name: "60 UC", price: 11000 }, { name: "120 UC", price: 22000 }, { name: "180 UC", price: 33000 },
            { name: "325 UC", price: 56000 }, { name: "385 UC", price: 68000 }, { name: "660 UC", price: 110000 }
        ];

        const premiumData = [
            { name: "1-oylik Premium", desc: "Akkauntga kirib olinadi ✔️", price: 45000 },
            { name: "1-yillik Premium", desc: "Akkauntga kirib olinadi ✔️", price: 290000 },
            { name: "3-oylik Premium", desc: "Akkauntga kirilmaydi ❌", price: 160000 },
            { name: "6-oylik Premium", desc: "Akkauntga kirilmaydi ❌", price: 220000 },
            { name: "1-yillik Premium", desc: "Akkauntga kirilmaydi ❌", price: 350000 }
        ];

        const pubgGrid = document.getElementById('grid-pubg');
        ucData.forEach(item => {
            pubgGrid.innerHTML += `
                <div class="card" onclick="openModal('${item.name}', ${item.price}, 'uc', '')">
                    ${ucIconSVG}
                    <div class="product-title">${item.name}</div>
                    <div class="product-price">${item.price.toLocaleString()} so'm</div>
                </div>`;
        });

        const premiumGrid = document.getElementById('grid-premium');
        premiumData.forEach(item => {
            premiumGrid.innerHTML += `
                <div class="card" onclick="openModal('${item.name}', ${item.price}, 'premium', '${item.desc}')">
                    ${premiumIconSVG}
                    <div class="product-title">${item.name}</div>
                    <div class="product-desc">${item.desc}</div>
                    <div class="product-price">${item.price.toLocaleString()} so'm</div>
                </div>`;
        });

        const list = document.querySelectorAll('.list');
        const pages = document.querySelectorAll('.page');
        list.forEach((item) => item.addEventListener('click', function() {
            list.forEach((i) => i.classList.remove('active'));
            this.classList.add('active');
            pages.forEach((page) => page.classList.remove('active-page'));
            document.getElementById(this.getAttribute('data-target')).classList.add('active-page');
        }));

        function switchCategory(category) {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => tab.classList.remove('active-tab'));
            if (category === 'pubg') {
                tabs[0].classList.add('active-tab');
                document.getElementById('grid-pubg').style.display = 'grid';
                document.getElementById('grid-premium').style.display = 'none';
            } else {
                tabs[1].classList.add('active-tab');
                document.getElementById('grid-pubg').style.display = 'none';
                document.getElementById('grid-premium').style.display = 'grid';
            }
        }

        let currentPrice = 0, currentQty = 1;

        function openModal(name, price, type, desc) {
            document.getElementById('buyModal').style.display = 'flex';
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('errorMsg').style.display = 'none';
            currentPrice = price; currentQty = 1;
            updateModalDisplay();

            const inputField = document.getElementById('playerIdInput');
            inputField.value = ''; 
            
            if(type === 'uc') {
                inputField.placeholder = "Player ID kiriting"; 
                inputField.type = "number";
            } else {
                inputField.type = "text";
                inputField.placeholder = desc.includes("kirib olinadi") ? "Raqam va Parolni kiriting" : "Username (@user) kiriting";
            }
        }

        function closeModal() { document.getElementById('buyModal').style.display = 'none'; }

        function changeQty(amount) {
            if (currentQty + amount >= 1) {
                currentQty += amount;
                document.getElementById('errorMsg').style.display = 'none';
                updateModalDisplay();
            }
        }

        function updateModalDisplay() {
            document.getElementById('qtyValue').innerText = currentQty;
            document.getElementById('modalTotalPrice').innerText = (currentPrice * currentQty).toLocaleString() + " so'm";
        }

        // SAVATGA QO'SHISH VA ANIMATSIYA LOGIKASI
        function processPurchase() {
            const idValue = document.getElementById('playerIdInput').value;
            if(!idValue) { alert("Iltimos, ma'lumotni to'ldiring!"); return; }

            const totalCost = currentPrice * currentQty;
            const errorEl = document.getElementById('errorMsg');
            const modalBox = document.getElementById('modalBox');

            if (totalCost > userBalance) {
                errorEl.style.display = 'block';
                modalBox.style.animation = 'none';
                modalBox.offsetHeight; 
                modalBox.style.animation = 'shakeError 0.4s ease';
            } else {
                errorEl.style.display = 'none';
                closeModal();
                animateToCart(); // Animatsiyani chaqirish
            }
        }

        function animateToCart() {
            const btn = document.getElementById('addCartBtn');
            const cartNavBtn = document.getElementById('cart-nav');
            const cartIcon = document.getElementById('cart-icon');
            
            const cartRect = cartNavBtn.getBoundingClientRect();
            
            // Uchadigan obyekt yaratish
            const flyingItem = document.createElement('div');
            flyingItem.classList.add('flying-item');
            
            // Obyektni ekranning o'rtasidan boshlash
            flyingItem.style.left = (window.innerWidth / 2 - 12.5) + 'px';
            flyingItem.style.top = (window.innerHeight / 2 - 12.5) + 'px';
            
            document.body.appendChild(flyingItem);

            // Brauzerga chizish uchun vaqt beramiz
            void flyingItem.offsetWidth;

            // Savat ikonkasi tomonga uchirish
            flyingItem.style.left = (cartRect.left + cartRect.width / 2 - 12.5) + 'px';
            flyingItem.style.top = (cartRect.top + cartRect.height / 2 - 12.5) + 'px';
            flyingItem.style.transform = 'scale(0.2)';
            flyingItem.style.opacity = '0';

            // Animatsiya tugagandan so'ng tozalash va savatni sakratish
            setTimeout(() => {
                flyingItem.remove();
                
                // Savat ikonkasiga sakrash animatsiyasini berish
                // Agar o'sha sahifada bo'lmasa, sakraydi.
                cartIcon.classList.add('cart-bump');
                setTimeout(() => {
                    cartIcon.classList.remove('cart-bump');
                }, 400);

            }, 600);
        }
    </script>
</body>
</html>
