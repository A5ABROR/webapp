<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donatshop UZ</title>
    <style>
        :root {
            --bg-dark: #060609;
            --card-bg: rgba(15, 15, 25, 0.7);
            --metal-glow: rgba(0, 255, 204, 0.2);
            --neon-blue: #00ffff;
            --neon-purple: #bd00ff;
            --text-main: #e2e8f0;
            --chrome-silver: linear-gradient(145deg, #e6e6e6, #8a99ad, #ffffff, #4a5568);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(189, 0, 255, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 255, 255, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            height: 100vh;
        }

        /* --- FUTURISTIK Y2K KIRISH EFEKTI (SPLASH SCREEN) --- */
        #splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #030305;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Pinterest uslubidagi suyuq metall va neon halqa */
        .cyber-loader {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Tashqi kiber-neon halqa */
        .outer-neon-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            border-left-color: var(--neon-blue);
            border-right-color: var(--neon-purple);
            filter: drop-shadow(0 0 15px var(--neon-blue));
            animation: cyberSpin 2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        /* Ichki aks etuvchi metall disk (Chrome Reflection) */
        .inner-chrome-disk {
            position: absolute;
            width: 75%;
            height: 75%;
            border-radius: 50%;
            background: linear-gradient(135deg, #111 0%, #222 30%, #555 50%, #222 70%, #111 100%);
            border: 3px solid #8a99ad;
            box-shadow: 
                inset 0 0 20px rgba(0, 255, 255, 0.3),
                0 0 25px rgba(189, 0, 255, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulseMetal 1.5s ease-in-out infinite alternate;
        }

        .inner-chrome-disk::after {
            content: '💎';
            font-size: 36px;
            filter: drop-shadow(0 0 10px var(--neon-blue));
        }

        @keyframes cyberSpin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.08); filter: drop-shadow(0 0 25px var(--neon-purple)); }
            100% { transform: rotate(360deg) scale(1); }
        }

        @keyframes pulseMetal {
            0% { transform: scale(0.95); box-shadow: inset 0 0 15px rgba(0, 255, 255, 0.2); }
            100% { transform: scale(1.02); box-shadow: inset 0 0 30px rgba(0, 255, 255, 0.5), 0 0 20px rgba(0,255,255,0.2); }
        }

        .loading-text {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #fff;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #5c5c6d, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShine 2s linear infinite;
        }

        @keyframes textShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* --- MAIN APP INTERFACE --- */
        #app {
            display: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            text-align: center;
            padding: 15px 0 10px 0;
            flex-shrink: 0;
        }
        .brand-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, #8a99ad, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

            padding: 15px;
