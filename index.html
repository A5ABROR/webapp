<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donatshop UZ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #09090e;
            --card-bg: rgba(18, 18, 29, 0.75);
            --neon-blue: #00ffff;
            --text-main: #e2e8f0;
            --chrome-silver: linear-gradient(145deg, #ffffff, #a0aec0, #cbd5e0, #4a5568);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* --- SPLASH SCREEN --- */
        #splash {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .splash-ui {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .splash-logo-container {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(0, 255, 230, 0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.2);
            margin-bottom: 20px;
        }

        .splash-logo-container span {
            font-size: 42px;
            filter: drop-shadow(0 0 10px var(--neon-blue));
        }

        .splash-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .loading-text {
            font-size: 11px;
            letter-spacing: 3px;
            color: #8a99ad;
            text-transform: uppercase;
        }

        .loading-num {
            font-size: 28px;
            font-weight: 800;
            color: var(--neon-blue);
            font-family: monospace;
            margin-top: 5px;
        }

        /* --- MAIN APP --- */
        #app {
            display: none;
            height: 100vh;
            flex-direction: column;
            width: 100%;
        }

        header {
            text-align: center;
            padding: 20px 0 10px 0;
        }

        .brand-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #fff;
        }

        .pages-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 110px;
        }

        .page {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .page.active {
            display: grid;
        }

        .category-nav {
            grid-column: span 2;
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }

        .nav-btn {
            flex: 1;
            background: rgba(20, 20, 35, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 14px;
            border-radius: 14px;
            color: #718096;
            font-weight: 700;
            font-size: 13px;
        }

        .nav-btn.active {
            color: #fff;
            border-color: var(--neon-blue);
            background: rgba(0, 255, 255, 0.08);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 14px;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }

        .card-info {
            font-size: 11px;
            color: #a0aec0;
            margin: 6px 0 12px 0;
        }

        .card-price {
            font-size: 15px;
            font-weight: 800;
            color: var(--neon-blue);
            margin-bottom: 12px;
        }

        .select-btn {
            width: 100%;
            background: var(--chrome-silver);
            border: none;
            padding: 11px;
            border-radius: 12px;
            color: #09090e;
            font-weight: 800;
            font-size: 13px;
        }

        .bottom-nav-container {
            position: fixed;
            bottom: 15px; left: 5%; width: 90%;
            height: 65px;
            background: #12121d;
            border-radius: 16px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .bottom-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #718096;
            text-decoration: none;
            font-size: 11px;
            flex: 1;
        }

        .bottom-item.active {
            color: var(--neon-blue);
        }

        .bottom-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <!-- KIBER SPLASH SCREEN -->
    <div id="splash">
        <div class="splash-ui">
            <div class="splash-logo-container">
                <span>💎</span>
            </div>
            <div class="splash-title">DONATSHOP UZ</div>
            <div class="loading-text">Yuklanmoqda...</div>
            <div class="loading-num" id="load-pct">0%</div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app">
        <header>
            <h1 class="brand-title">DONATSHOP UZ</h1>
        </header>

        <div class="pages-container">
            <div id="page-dukon" class="page active">
                <div class="category-nav">
                    <button class="nav-btn active">⭐ TG Premium</button>
                    <button class="nav-btn">🔴 PUBG UC</button>
                </div>
                
                <div class="card">
                    <div class="card-title">1 oylik Premium</div>
                    <div class="card-info">Kirish talab etiladi ➡️</div>
                    <div class="card-price">45.000 so’m</div>
                    <button class="select-btn">Tanlash</button>
                </div>
                <div class="card">
                    <div class="card-title">3 oylik Premium</div>
                    <div class="card-info">Kirish shart emas ❌</div>
                    <div class="card-price">160.000 so’m</div>
                    <button class="select-btn">Tanlash</button>
                </div>
            </div>
        </div>

        <div class="bottom-nav-container">
            <div class="bottom-item active">
                <span class="bottom-icon">🛍️</span>
                <span>Do'kon</span>
            </div>
            <div class="bottom-item">
                <span class="bottom-icon">👤</span>
                <span>Profil</span>
            </div>
        </div>
    </div>

    <script>
        // FOIZ HISOBLAGICH - ENG BIRINCHI ISHLAYDIGAN SCRIPT
        (function() {
            let currentPct = 0;
            const pctElement = document.getElementById('load-pct');
            
            const interval = setInterval(() => {
                currentPct += 5;
                if (currentPct >= 100) {
                    currentPct = 100;
                    clearInterval(interval);
                    
                    // Splashni yopish va dasturni ochish
                    document.getElementById('splash').style.opacity = '0';
                    document.getElementById('app').style.display = 'flex';
                    setTimeout(() => {
                        document.getElementById('splash').style.display = 'none';
                    }, 300);
                }
                pctElement.innerText = currentPct + '%';
            }, 100); // 2 soniyada to'liq yuklanadi
        })();

        // Telegram Web App sozlamasi
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
            }
        } catch (e) { console.error(e); }
    </script>
</body>
</html>
