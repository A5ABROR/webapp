<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donatshop UZ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #060609;
            --card-bg: rgba(15, 15, 25, 0.7);
            --metal-glow: rgba(0, 255, 204, 0.2);
            --neon-blue: #00ffff;
            --neon-purple: #bd00ff;
            --text-main: #e2e8f0;
            --chrome-silver: linear-gradient(145deg, #e6e6e6, #8a99ad, #ffffff, #4a5568);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(189, 0, 255, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 255, 255, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            height: 100vh;
            width: 100vw;
        }

        /* --- BUTUN EKRANLI (FULL-SCREEN) SPLASH SCREEN --- */
        #splash {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Elementlarni pastroqqa tekislaydi */
            align-items: center;
            opacity: 1;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        /* Fon rasmi - Butun ekranni egallaydi va qimirlaydi */
        .splash-bg-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ekranni to'liq yopadi */
            z-index: 1;
            filter: brightness(0.75) contrast(1.1); /* Matnlar ko'rinishi uchun biroz qoraytirilgan */
            animation: fullScreenBreathe 6s ease-in-out infinite alternate;
        }

        /* Ekran kattalashganda sekin nafas olish effekti */
        @keyframes fullScreenBreathe {
            0% { transform: scale(1); filter: brightness(0.7) blur(0px); }
            100% { transform: scale(1.06); filter: brightness(0.85) blur(0px); }
        }

        /* Matnlar va foiz konteyneri (Rasm ustida turgani uchun soyali va xiralashgan orqa fon) */
        .splash-content-box {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 85%;
            max-width: 320px;
            background: rgba(6, 6, 9, 0.65);
            padding: 20px;
            border-radius: 24px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 20px rgba(189, 0, 255, 0.15);
            margin-bottom: 60px; /* Ekran pastidan bo'shliq */
        }

        /* 1% dan 100% gacha to'ladigan foiz stili */
        .loading-percentage {
            font-size: 38px;
            font-weight: 900;
            color: #ffffff;
            font-family: monospace;
            letter-spacing: 1px;
            text-shadow: 0 0 15px var(--neon-blue), 0 0 30px var(--neon-blue);
            margin-bottom: 6px;
        }

        /* Uchib-yonadigan yuklanmoqda yozuvi */
        .sub-loading-text {
            color: #ffffff;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 800;
            animation: textBlink 1.4s infinite;
        }

        @keyframes textBlink {
            0%, 100% { opacity: 0.2; text-shadow: none; color: #8a99ad; }
            50% { opacity: 1; color: #ffffff; text-shadow: 0 0 12px var(--neon-purple); }
        }

        /* --- ASOSIY ILOVA INTERFEYSI --- */
        #app {
            display: none;
            height: 100vh;
            flex-direction: column;
            width: 100%;
        }

        header {
            text-align: center;
            padding: 15px 0 10px 0;
            flex-shrink: 0;
        }
        .brand-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, #8a99ad, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .pages-container {
            flex: 1;
            position: relative;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 95px;
        }
        
        .page {
            position: absolute;
            top: 15px; left: 15px; right: 15px;
            opacity: 0;
            transform: translateX(100px);
            visibility: hidden;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease, visibility 0.4s;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .page.active {
            opacity: 1;
            transform: translateX(0);
            visibility: visible;
            position: relative;
            top: 0; left: 0; right: 0;
        }

        .page.exit {
            transform: translateX(-100px);
            opacity: 0;
        }

        .category-nav {
            grid-column: span 2;
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }
        .nav-btn {
            flex: 1;
            background: linear-gradient(145deg, #161622, #0d0d15);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            color: #8a8a98;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        .nav-btn.active {
            color: #fff;
            border-color: rgba(0, 255, 255, 0.4);
            box-shadow: inset 0 0 8px var(--metal-glow), 0 4px 15px rgba(0,255,255,0.1);
            background: linear-gradient(145deg, #1c2438, #111622);
        }

        /* --- KARTALAR TIZIMI --- */
        .card {
            background: linear-gradient(135deg, rgba(25, 25, 35, 0.7), rgba(12, 12, 18, 0.85));
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
        }
        .card-title {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }
        .card-info {
            font-size: 10px;
            color: #8a8a98;
            margin: 6px 0 12px 0;
            min-height: 28px;
            display: flex;
            align-items: center;
        }
        .card-info.login-required { color: #ffbc00; }
        .card-info.no-login { color: #00ffaa; }

        .card-price {
            font-size: 14px;
            font-weight: 800;
            color: var(--neon-blue);
            margin-bottom: 12px;
        }
        .select-btn {
            width: 100%;
            background: var(--chrome-silver);
            border: none;
            padding: 10px;
            border-radius: 10px;
            color: #11151d;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        .full-section {
            grid-column: span 2;
            background: rgba(20, 20, 30, 0.4);
            border: 1px dashed rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            color: #5c5c6d;
        }

        /* --- BOTTOM NAV --- */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            height: 75px;
            background: rgba(6, 6, 9, 0.92);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }
        .bottom-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #5c5c6d;
            font-size: 11px;
            text-decoration: none;
            font-weight: 600;
            flex: 1;
            height: 100%;
            transition: color 0.3s ease;
        }
        .bottom-icon {
            font-size: 22px;
            margin-bottom: 4px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .bottom-item.active {
            color: var(--neon-blue);
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
        }
        .bottom-item.active .bottom-icon {
            transform: translateY(-6px) scale(1.25);
            animation: pulseGlow 1.8s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 4px var(--neon-blue)); }
            100% { filter: drop-shadow(0 0 12px var(--neon-blue)) drop-shadow(0 0 8px var(--neon-purple)); }
        }
    </style>
</head>
